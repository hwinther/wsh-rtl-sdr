# Per-image smoke-test orchestration. NOT for production.
#
# Usage (one image in isolation, builds if missing):
#   docker compose -f docker-compose.test.yml --profile readsb up --build
#
# Prefer the wrapper, which adds assertions + guaranteed teardown:
#   pwsh scripts/smoke-test.ps1 <image>     (Windows)
#   bash scripts/smoke-test.sh  <image>     (Linux/CI)
#
# RF hardware is simulated WITHOUT a dongle:
#   - readsb runs as a pure --net-only Beast/raw hub, the shared hub the network
#     consumers connect to (by its service name, as in the cluster).
#   - ais-catcher reads an infinite zero IQ stream (/dev/zero) instead of an
#     RTL-SDR; its web server still comes up, which ais-catcher-probe checks.
#   - dump1090-exporter and adsb-mqtt read the hub's JSON directory; adsb-mqtt publishes to a
#     throwaway mosquitto.
#   - gsm-tools is build-only: assert key SDR binaries resolve on PATH.
#
# Each service is gated behind a profile equal to its image name. readsb
# is a member of every consumer profile so e.g. `--profile fr24` transitively
# starts the hub and waits for it to become healthy before fr24 starts.

name: wsh-rtl-sdr-smoketest

networks:
  sdrtest:
    driver: bridge

services:
  # --- RF image: ADS-B decoder (readsb), run as a no-SDR Beast/raw hub ------
  # --net-only => no SDR is opened; it still listens on 30002-30005/30104 and writes its JSON
  # directory, which is the dongle simulation. Distroless: no shell, so readsb-probe below
  # carries the health check.
  readsb:
    build:
      context: ./images/readsb
    image: wsh-rtl-sdr-smoketest/readsb
    networks: [sdrtest]
    command:
      - --net-only
      - --net-ro-port
      - "30002"
      - --net-sbs-port
      - "30003"
      - --net-bi-port
      - "30004,30104"
      - --net-bo-port
      - "30005"
      - --write-json
      - /run/readsb
      # As on the edge: tar1090 reads tracks from readsb's traces and globe files.
      - --write-json-globe-index
      - --json-location-accuracy
      - "1"
      - --lat
      - "59.91"
      - --lon
      - "10.75"
      - --quiet
    volumes:
      - readsb-json:/run/readsb
    depends_on:
      readsb-json-init:
        condition: service_completed_successfully
    # Shared hub: present in every consumer profile + its own.
    profiles: [readsb, piaware, fr24, opensky, adsb-mqtt, dump1090-exporter, tar1090]

  # The JSON volume starts root-owned; readsb runs as distroless's nonroot (65532).
  readsb-json-init:
    image: busybox:1.37
    command: ["chown", "65532:65532", "/run/readsb"]
    volumes:
      - readsb-json:/run/readsb
    profiles: [readsb, piaware, fr24, opensky, adsb-mqtt, dump1090-exporter, tar1090]

  # Pass condition for readsb, and what the consumers wait for: the Beast output port answers and
  # readsb has written its JSON (receiver.json, stats.json, aircraft.json, as tar1090 and the
  # exporter read them in the cluster).
  readsb-probe:
    image: busybox:1.37
    networks: [sdrtest]
    command: ["sleep", "infinity"]
    volumes:
      - readsb-json:/run/readsb:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w2 readsb 30005 && test -s /run/readsb/receiver.json && test -s /run/readsb/stats.json && test -s /run/readsb/aircraft.json"]
      interval: 5s
      timeout: 5s
      retries: 24
    profiles: [readsb, piaware, fr24, opensky, adsb-mqtt, dump1090-exporter, tar1090]

  # --- RF image: AIS receiver, fed an infinite zero IQ stuck-no-dongle ------
  ais-catcher:
    build:
      context: ./images/ais-catcher
    image: wsh-rtl-sdr-smoketest/ais-catcher
    networks: [sdrtest]
    # The edge Deployment's command line, with /dev/zero read as raw CU8 in place of the dongle
    # (`-d <serial>`), so the decoder and web server stay up with no hardware. The image is
    # distroless: no shell, so this is the exec-form argument list. The `-u` feed targets a
    # host name: the static (musl) binary must resolve it, or AIS-catcher exits ("Name does not
    # resolve") and the run fails. No `-X` or MQTT: CI must not feed aiscatcher.org.
    command:
      - -M
      - DT
      - -gr
      - TUNER
      - "38.6"
      - RTLAGC
      - "off"
      - BIASTEE
      - "on"
      - -s
      - 2304k
      - -r
      - CU8
      - /dev/zero
      - -o
      - "0"
      - -N
      - "8100"
      - GEOJSON
      - "on"
      - STATION
      - Smoke test
      - LAT
      - "59.91"
      - LON
      - "10.75"
      - -N
      - PLUGIN_DIR
      - /usr/share/aiscatcher/my-plugins
      - -N
      - REALTIME
      - "on"
      - -N
      - PROME
      - "on"
      - -u
      - ais-catcher-probe
      - "2233"
    depends_on:
      ais-catcher-probe:
        condition: service_started
    profiles: [ais-catcher]

  # The distroless image has no shell for a HEALTHCHECK, so this probe's healthcheck is the pass
  # condition: the web UI answers and /metrics serves AIS-catcher's counters.
  ais-catcher-probe:
    image: curlimages/curl:8.17.0
    networks: [sdrtest]
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://ais-catcher:8100/ >/dev/null && curl -fsS http://ais-catcher:8100/metrics | grep -q '^ais_stat_count '"]
      interval: 5s
      timeout: 5s
      retries: 24
    profiles: [ais-catcher]

  # --- JSON readers: distroless python, read readsb's JSON directory --------
  # dump1090-exporter as the cluster runs it (a sidecar reading the shared directory). Pass
  # condition (exporter-probe): /metrics serves the stats readsb wrote.
  dump1090-exporter:
    build:
      context: ./images/dump1090-exporter
    image: wsh-rtl-sdr-smoketest/dump1090-exporter
    networks: [sdrtest]
    environment:
      RESOURCE_PATH: /run/readsb
    volumes:
      - readsb-json:/run/readsb:ro
    depends_on:
      readsb-probe:
        condition: service_healthy
    profiles: [dump1090-exporter]

  exporter-probe:
    image: curlimages/curl:8.17.0
    networks: [sdrtest]
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://dump1090-exporter:9105/metrics | grep -q '^dump1090_messages_total'"]
      interval: 5s
      timeout: 5s
      retries: 24
    profiles: [dump1090-exporter]

  # adsb-mqtt publishing aircraft.json to a throwaway broker. Pass condition (adsb-mqtt-probe): one
  # message arrives on the topic.
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    networks: [sdrtest]
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    profiles: [adsb-mqtt]

  adsb-mqtt:
    build:
      context: ./images/adsb-mqtt
    image: wsh-rtl-sdr-smoketest/adsb-mqtt
    networks: [sdrtest]
    environment:
      MQTT_HOST: mosquitto
      PUBLISH_UNCHANGED: "true"
    volumes:
      - readsb-json:/data:ro
    depends_on:
      readsb-probe:
        condition: service_healthy
      mosquitto:
        condition: service_started
    profiles: [adsb-mqtt]

  adsb-mqtt-probe:
    image: eclipse-mosquitto:2.0.22
    networks: [sdrtest]
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h mosquitto -t adsb/aircraft -C 1 -W 4 | grep -q '\"now\"'"]
      interval: 5s
      timeout: 6s
      retries: 24
    profiles: [adsb-mqtt]

  # --- Web UI: static tar1090 (Go file server), serving the hub's JSON directory
  tar1090:
    build:
      context: ./images/tar1090
    image: wsh-rtl-sdr-smoketest/tar1090
    networks: [sdrtest]
    volumes:
      - readsb-json:/run/readsb:ro
    depends_on:
      readsb-probe:
        condition: service_healthy
    profiles: [tar1090]

  # Pass condition for tar1090 (distroless, no shell): the UI is served with the aircraft database
  # wired in, receiver.json comes through /data with the globe index on, and a globe file readsb
  # wrote (gzip without a .gz suffix) is served with Content-Encoding: gzip.
  tar1090-probe:
    image: curlimages/curl:8.17.0
    networks: [sdrtest]
    command: ["sleep", "infinity"]
    volumes:
      - readsb-json:/run/readsb:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://tar1090:8080/ | grep -q 'databaseFolder = "db-' &&
          curl -fsS http://tar1090:8080/data/receiver.json | grep -q globeIndexGrid &&
          g=$$(ls /run/readsb | grep -m1 '^globe_[0-9]*\.json$$') &&
          curl -fsSI "http://tar1090:8080/data/$$g" | grep -qi '^content-encoding: gzip'
      interval: 5s
      timeout: 10s
      retries: 24
    profiles: [tar1090]

  # --- Network consumers: need a healthy readsb hub ------------------------
  piaware:
    build:
      context: ./images/piaware
    image: wsh-rtl-sdr-smoketest/piaware
    networks: [sdrtest]
    depends_on:
      readsb-probe:
        condition: service_healthy
    # The edge Deployment mounts the same file from its Secret, with the real feeder-id. Here no
    # feeder-id and adept-serverhosts 127.0.0.1: CI must not log in to FlightAware (a guest login
    # registers a new feeder ID every run). piaware keeps retrying the login and stays up, which is
    # the pass condition: the image runs and parses the config.
    configs:
      - source: piaware-conf
        target: /etc/piaware.conf
    tmpfs:
      - /var/cache/piaware:uid=65532,gid=65532
      - /run/piaware:uid=65532,gid=65532
    profiles: [piaware]

  fr24:
    build:
      context: ./images/fr24
    image: wsh-rtl-sdr-smoketest/fr24
    networks: [sdrtest]
    depends_on:
      readsb-probe:
        condition: service_healthy
    # The edge Deployment's flags, with a dummy key: fr24feed stays up retrying when the key is
    # rejected. Distroless, so fr24-probe carries the health check.
    command:
      - --fr24key=0000000000000000
      - --receiver=avr-tcp
      - --host=readsb:30002
      - --bs=no
      - --raw=no
      - --mlat=no
      - --mlat-without-gps=no
    profiles: [fr24]

  # Pass condition for fr24: its status page says it is connected to the hub's raw output (it would
  # hang before the reader starts if the /bin/bash stub were missing).
  fr24-probe:
    image: curlimages/curl:8.17.0
    networks: [sdrtest]
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://fr24:8754/monitor.json | grep -q '\"rx_connected\":\"1\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
    profiles: [fr24]

  opensky:
    build:
      context: ./images/opensky
    image: wsh-rtl-sdr-smoketest/opensky
    networks: [sdrtest]
    depends_on:
      readsb-probe:
        condition: service_healthy
    # The edge Deployment mounts the same file from its Secret. Dummy username/serial, as before:
    # openskyd logs in and is refused, but stays up feeding nothing.
    configs:
      - source: opensky-conf
        target: /etc/openskyd/conf.d/10-opensky.conf
    profiles: [opensky]

  # --- Interactive image: build + binary-exists check, no daemon ----------
  gsm-tools:
    build:
      context: ./images/gsm-tools
    image: wsh-rtl-sdr-smoketest/gsm-tools
    networks: [sdrtest]
    # Runs once and exits 0 iff the key SDR binaries are on PATH; the wrapper
    # checks the exit code (there is no port/daemon to probe).
    entrypoint:
      - /bin/bash
      - -lc
      - 'command -v rtl_sdr && command -v kal && command -v grgsm_livemon && echo "gsm-tools OK"'
    profiles: [gsm-tools]

volumes:
  readsb-json:

configs:
  piaware-conf:
    content: |
      allow-auto-updates no
      allow-manual-updates no
      allow-mlat yes
      mlat-results yes
      receiver-type other
      receiver-host readsb
      receiver-port 30005
      mlat-results-format beast,connect,readsb:30104
      use-gpsd no
      adept-serverhosts 127.0.0.1
  opensky-conf:
    content: |
      [GPS]
      Latitude=59.91
      Longitude=10.75
      Altitude=0

      [DEVICE]
      Type=default
      serial 0000000000

      [IDENT]
      Username=smoketest

      [INPUT]
      Host=readsb
      Port=30005
