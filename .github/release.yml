# Synced from wshno/devops settings-sync/files/release.yml (as .github/release.yml): change it there.
#
# Groups the generated release notes by the PR labels the "Type label" workflow sets from the
# Conventional Commits title. A PR lands in the FIRST category that matches, so the order is the order
# of importance; dependencies come before build/ci/chore so Dependabot PRs ("chore(deps): ...",
# "build(deps): ...") are listed as dependency updates.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 💥 Breaking changes
      labels: [breaking]
    - title: ✨ Features
      labels: [feature, enhancement]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: ⚡ Performance
      labels: [performance]
    - title: ♻️ Refactoring
      labels: [refactor]
    - title: 📝 Documentation
      labels: [documentation]
    - title: 🧪 Tests
      labels: [test]
    - title: ⬆️ Dependencies
      labels: [dependencies]
    - title: 👷 Build and CI
      labels: [build, ci]
    - title: 🧹 Other changes
      labels: ["*"]
