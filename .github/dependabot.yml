# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "monday"
  cooldown:
    default-days: 7
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows/*"

- package-ecosystem: "docker"
  directories:
  - "/images/fr24"
  - "/images/opensky"
  - "/images/piaware"
  - "/images/tar1090"
  - "/images/ais-catcher"
  - "/images/readsb"
  - "/images/adsb-mqtt"
  - "/images/dump1090-exporter"
  - "/images/gsm-tools"
  - "/images/sdr-toolbox"
  schedule:
    interval: "daily"
  cooldown:
    default-days: 7
  open-pull-requests-limit: 20
  groups:
    # The same base digests are pinned in most Dockerfiles here (debian:trixie-slim, alpine,
    # tonistiigi/xx, golang, distroless), so one upstream push would otherwise open a PR per
    # directory. Group them into a single PR across all directories.
    base-images:
      patterns:
      - "debian"
      - "alpine"
      - "tonistiigi/xx"
      - "golang"
      - "gcr.io/distroless/*"

# The distroless python images pin their whole dependency tree in requirements.txt (installed with
# --no-deps). Grouped per directory, so aiohttp and its helpers arrive as one PR.
- package-ecosystem: "pip"
  directories:
  - "/images/adsb-mqtt"
  - "/images/dump1090-exporter"
  schedule:
    interval: "weekly"
    day: "monday"
  cooldown:
    default-days: 7
  groups:
    python:
      patterns:
      - "*"
  # dump1090exporter 22.3.0 (unmaintained since 2022) needs aioprometheus 22.3's API: 23.x fails at
  # import ("from aioprometheus import Gauge"), which the smoke test caught in #71.
  ignore:
  - dependency-name: "aioprometheus"
