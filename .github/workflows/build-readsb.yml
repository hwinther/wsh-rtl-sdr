name: Build readsb container image

# ADS-B decoder: readsb (wiedehopf) built from pinned upstream source as a static binary on
# distroless (see images/readsb/Dockerfile), replacing dump1090-fa. Cross-compiled for arm64, so
# no QEMU build. Rebuilt on every merge that touches images/readsb/: Dependabot's digest bumps and
# bump-sources.yml's weekly upstream bump both do.

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "images/readsb/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readsb:
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@83abef784511f6e7704a512164741a9bdebcbf3a # v2.9.1
    with:
      container_image_name_postfix: readsb
      build_context: images/readsb
      dockerfile: images/readsb/Dockerfile
      platforms: linux/amd64,linux/arm64
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}
