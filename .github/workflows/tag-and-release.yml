name: Create release

# Manually dispatched: creates a v* tag (or auto-bumps minor from latest) and, optionally, a GitHub
# Release. The tag is pushed with the wshno-devops-bot GitHub App's token, so the push itself starts
# "Publish release" (release.yml), which builds the nine edge images and publishes the signed
# manifest artifact once all of them are pushed. (A tag pushed with GITHUB_TOKEN wouldn't trigger it.)
#
# Upstream feeders carry vulnerabilities we can't fix? Let "Publish release" fail on the Grype gate,
# then run it by hand at the tag ("Use workflow from" -> the tag) with "Skip the Grype gate" on.
#
# Needs: repository variable DEVOPS_BOT_CLIENT_ID and secret DEVOPS_BOT_PRIVATE_KEY, and the App
# installed on this repo with Contents: write.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag (e.g. v1.2.3), or 'auto' for the next minor"
        required: false
        default: "auto"
      release_notes:
        description: "Release notes"
        required: false
      create_release:
        description: "Also create a GitHub Release"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  tag:
    permissions:
      contents: write
    uses: hwinther/reusable-workflows/.github/workflows/tag-and-release.yml@9a681fd609e4169b4293a0c4409acce9f809cb77 # v2.26.1
    with:
      tag_name: ${{ inputs.tag_name }}
      release_notes: ${{ inputs.release_notes }}
      create_release: ${{ inputs.create_release }}
      app_client_id: ${{ vars.DEVOPS_BOT_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.DEVOPS_BOT_PRIVATE_KEY }}
