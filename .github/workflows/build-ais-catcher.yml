name: Build ais-catcher container image

# AIS receiver: AIS-catcher built from pinned upstream source as a static binary on distroless (see
# images/ais-catcher/Dockerfile). Cross-compiled for arm64, so no QEMU build. Rebuilt on every
# merge that touches images/ais-catcher/: Dependabot's digest bumps and bump-sources.yml's weekly
# upstream bump both do.

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "images/ais-catcher/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ais-catcher:
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@30b720023773620bec5892d30431d66410c287c0 # v2.19.0
    with:
      container_image_name_postfix: ais-catcher
      build_context: images/ais-catcher
      dockerfile: images/ais-catcher/Dockerfile
      platforms: linux/amd64,linux/arm64
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}
