# Synced from wshno/devops settings-sync/files/workflows/manifest-diff.yml: change it there.
name: 'Manifest diff'

# Renders deploy/ for the PR head and its base, validates the head, and posts a review report
# (a resource map per render plus a dyff per changed resource) to the job summary and a sticky PR
# comment, so manifest review happens here rather than in the cluster repo's tag bump. Both sides
# keep the placeholder image tags; releases pin tag@digest.
#
# What to render comes from the repo's own .github/manifest-renders.txt (not synced), one
# `<out-path>=<deploy-dir>[,<component>]` per line; blank lines and # comments are ignored. A
# repo's release and PR-preview workflows can publish from the same file (manifests action
# renders_file), so the reviewed renders are the released ones.

on:
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/manifest-renders.txt'
      - '.github/workflows/manifest-diff.yml'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render, validate and report
        uses: hwinther/reusable-workflows/.github/actions/manifests@1fa5882e8aa1048af78492baf016f5a7b310be11 # v2.29.0
        with:
          mode: diff
          # Read on the PR head and used for both sides; the action fails on a missing or empty file.
          renders_file: .github/manifest-renders.txt
