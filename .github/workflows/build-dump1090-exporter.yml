name: Build dump1090-exporter container image

# Prometheus exporter for readsb's reception stats (sidecar reading the shared JSON directory).
# Uses the shared
# reusable docker-container workflow so the image gets the SLSA provenance the cluster's
# supply-chain policies require.

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "images/dump1090-exporter/**"
  # Build and Grype-scan on the PR, no push: the report lands on the PR before anything is published.
  pull_request:
    branches: [main]
    paths:
      - "images/dump1090-exporter/**"
      - ".github/workflows/build-dump1090-exporter.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/build-and-scan-docker.yml@3a42f0c604e95cd46a9b9e01519aea3f425c5589 # v2.33.0
    with:
      container_image_name_postfix: dump1090-exporter
      build_context: images/dump1090-exporter
      dockerfile: images/dump1090-exporter/Dockerfile
      # Nothing downstream consumes the loaded image or supply-chain files on a PR.
      generate_supply_chain_artifacts: false
      release_asset_upload_enabled: false

  dump1090-exporter:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: write
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_image_name_postfix: dump1090-exporter
      build_context: images/dump1090-exporter
      dockerfile: images/dump1090-exporter/Dockerfile
      platforms: linux/amd64,linux/arm64
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}
