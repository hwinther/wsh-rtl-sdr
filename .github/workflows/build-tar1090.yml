name: Build tar1090 container image

# Web UI: tar1090 static files + a small Go file server on distroless (see images/tar1090/Dockerfile).
# Rebuilt when tag-and-release.yml dispatches it for a v* tag, on workflow_dispatch, and on merges
# that touch images/tar1090/ (Dependabot's digest bumps, tar1090/tar1090-db ref bumps).

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "images/tar1090/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tar1090:
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@3c1d9515664e32cffe91cb44845be94dd4c6fdf6 # v2.25.0
    with:
      container_image_name_postfix: tar1090
      build_context: images/tar1090
      dockerfile: images/tar1090/Dockerfile
      platforms: linux/amd64,linux/arm64
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}
