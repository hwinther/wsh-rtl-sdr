name: Build piaware container image

# Feeder image: FlightAware piaware from piaware_builder on plain debian:trixie-slim (see images/piaware/Dockerfile).
# Rebuilt when tag-and-release.yml dispatches it for a v* tag, on workflow_dispatch, and on merges
# that touch images/piaware/ (Dependabot's debian digest bumps, piaware_builder version bumps).

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "images/piaware/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  piaware:
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_image_name_postfix: piaware
      build_context: images/piaware
      dockerfile: images/piaware/Dockerfile
      platforms: linux/amd64,linux/arm64
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}
