name: Build fr24 container image

# Feeder image: Flightradar24's static fr24feed on distroless (see images/fr24/Dockerfile).
# Rebuilt when tag-and-release.yml dispatches it for a v* tag, on workflow_dispatch, and on merges
# that touch images/fr24/ (Dependabot's digest bumps, fr24feed version bumps).

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "images/fr24/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fr24:
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@3c1d9515664e32cffe91cb44845be94dd4c6fdf6 # v2.25.0
    with:
      container_image_name_postfix: fr24
      build_context: images/fr24
      dockerfile: images/fr24/Dockerfile
      platforms: linux/amd64,linux/arm64
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}
