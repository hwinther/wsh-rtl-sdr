name: Smoke test container images

# Builds and smoke-tests each image in isolation with NO RTL-SDR hardware,
# using docker-compose.test.yml + scripts/smoke-test.sh. The RF images run in
# no-SDR modes (readsb --net-only hub, ais-catcher reading /dev/zero);
# network consumers are gated on a healthy readsb hub. amd64 only to keep CI fast.
# gsm-tools is a developer tool with a long build and is not run here; test it locally with
# `bash scripts/smoke-test.sh gsm-tools` (a build + binary-exists check).
#
# One matrix job per image == "test each of them separately" with independent
# pass/fail status. Complements (does not replace) the publish pipeline in the
# build-<image>.yml workflows.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Only this image (empty: all). bump-sources.yml dispatches one per bump PR."
        required: false
        default: ""
  pull_request:
    branches: ["**"]
    paths:
      - "images/**"
      - "docker-compose.test.yml"
      - "scripts/smoke-test.*"
      - ".github/workflows/smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "docker-compose.test.yml"
      - "scripts/smoke-test.*"
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - readsb
          - ais-catcher
          - tar1090
          - piaware
          - fr24
          - adsbexchange
          - opensky
    steps:
      - name: Checkout repository
        if: ${{ !inputs.image || inputs.image == matrix.image }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test ${{ matrix.image }}
        if: ${{ !inputs.image || inputs.image == matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/smoke-test.sh "$IMAGE"

      # ais-catcher and readsb are each one static binary on distroless: no package database, so an
      # image scan finds nothing. The libraries compiled into them are listed in the CycloneDX SBOM
      # each image carries; scan that instead (Kubescape reads the same file in the cluster via
      # scanEmbeddedSBOMs).
      - name: Extract the embedded SBOM
        if: ${{ (matrix.image == 'ais-catcher' || matrix.image == 'readsb') && (!inputs.image || inputs.image == matrix.image) }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cid=$(docker create "wsh-rtl-sdr-smoketest/$IMAGE")
          docker cp "$cid:/usr/share/sbom/$IMAGE.cdx.json" "$RUNNER_TEMP/embedded.cdx.json"
          docker rm "$cid" >/dev/null
          jq -r '.components[] | "\(.name) \(.version)"' "$RUNNER_TEMP/embedded.cdx.json"

      - name: Scan the embedded SBOM
        if: ${{ (matrix.image == 'ais-catcher' || matrix.image == 'readsb') && (!inputs.image || inputs.image == matrix.image) }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/embedded.cdx.json
          severity-cutoff: high
          only-fixed: true
          output-format: table
