name: Smoke test container images

# Builds and smoke-tests each image in isolation with NO RTL-SDR hardware,
# using docker-compose.test.yml + scripts/smoke-test.sh. The RF images run in
# no-SDR modes (readsb --net-only hub, ais-catcher reading /dev/zero);
# network consumers are gated on a healthy readsb hub. amd64 only to keep CI fast.
# gsm-tools is a developer tool with a long build and is not run here; test it locally with
# `bash scripts/smoke-test.sh gsm-tools` (a build + binary-exists check).
#
# One matrix job per image == "test each of them separately" with independent
# pass/fail status. Complements (does not replace) the publish pipeline in the
# build-<image>.yml workflows.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Only this image (empty: all). bump-sources.yml dispatches one per bump PR."
        required: false
        default: ""
  pull_request:
    branches: ["**"]
    paths:
      - "images/**"
      - "docker-compose.test.yml"
      - "scripts/smoke-test.*"
      - ".github/workflows/smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "docker-compose.test.yml"
      - "scripts/smoke-test.*"
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - readsb
          - ais-catcher
          - tar1090
          - piaware
          - fr24
          - adsbexchange
          - opensky
    steps:
      - name: Checkout repository
        if: ${{ !inputs.image || inputs.image == matrix.image }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test ${{ matrix.image }}
        if: ${{ !inputs.image || inputs.image == matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/smoke-test.sh "$IMAGE"

      # ais-catcher and readsb are each one static binary on distroless: no package database, so an
      # image scan finds nothing. The libraries compiled into them are listed in the CycloneDX SBOM
      # each image carries; scan that instead (Kubescape reads the same file in the cluster via
      # scanEmbeddedSBOMs).
      - name: Extract the embedded SBOM
        if: ${{ (matrix.image == 'ais-catcher' || matrix.image == 'readsb') && (!inputs.image || inputs.image == matrix.image) }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cid=$(docker create "wsh-rtl-sdr-smoketest/$IMAGE")
          docker cp "$cid:/usr/share/sbom/$IMAGE.cdx.json" "$RUNNER_TEMP/embedded.cdx.json"
          docker rm "$cid" >/dev/null
          jq -r '.components[] | "\(.name) \(.version)"' "$RUNNER_TEMP/embedded.cdx.json"

      # The Grype vulnerability DB (~75 s to download) under the same key and directory as
      # reusable-workflows' _scan-image, so this restores what the image builds in this repo already
      # cached (PRs read main's cache). Anchore publishes one DB a day around 06:30 UTC, hence the
      # key rolls over at 08:00 UTC; Grype still checks for a newer DB on a hit.
      - name: Grype DB cache key
        id: grype-db
        if: ${{ (matrix.image == 'ais-catcher' || matrix.image == 'readsb') && (!inputs.image || inputs.image == matrix.image) }}
        run: |
          set -euo pipefail
          echo "key=grype-db-v6-$(date -u -d '-8 hours' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "dir=${XDG_CACHE_HOME:-$HOME/.cache}/grype/db" >> "$GITHUB_OUTPUT"

      - name: Restore Grype DB
        id: grype-db-restore
        if: ${{ steps.grype-db.outputs.key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.grype-db.outputs.dir }}
          key: ${{ steps.grype-db.outputs.key }}

      - name: Scan the embedded SBOM
        if: ${{ (matrix.image == 'ais-catcher' || matrix.image == 'readsb') && (!inputs.image || inputs.image == matrix.image) }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/embedded.cdx.json
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # On a miss, keep today's DB for the next run (parallel jobs race for the key; the losers only
      # log a warning). hashFiles() only sees the workspace, so the DB's presence is checked here.
      - name: Check for a new Grype DB
        id: grype-db-new
        if: ${{ always() && steps.grype-db.outputs.key != '' && steps.grype-db-restore.outputs.cache-hit != 'true' }}
        env:
          DB_DIR: ${{ steps.grype-db.outputs.dir }}
        run: |
          if [ -n "$(find "$DB_DIR" -name '*.db' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Grype DB
        if: ${{ always() && steps.grype-db-new.outputs.present == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.grype-db.outputs.dir }}
          key: ${{ steps.grype-db.outputs.key }}
