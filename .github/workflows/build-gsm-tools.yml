name: Build gsm-tools container image

# Developer tool (GSM/LTE/Iridium analysis), amd64 only, on debian:trixie-slim (digest-pinned in
# images/gsm-tools/Dockerfile so Dependabot tracks it). Not dispatched by tag-and-release.yml;
# rebuilt on merges that touch images/gsm-tools/ and runnable manually.
#
# Pipeline (via the reusable docker-container.yml): gitversion → buildx → SBOM → Grype → push →
# cosign keyless sign → CycloneDX/vuln attestations → SLSA provenance.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "images/gsm-tools/**"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gsm-tools:
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@30b720023773620bec5892d30431d66410c287c0 # v2.19.0
    with:
      container_image_name_postfix: gsm-tools
      build_context: images/gsm-tools
      dockerfile: images/gsm-tools/Dockerfile
      # amd64 only: a developer tool run on a workstation, and gnuradio + gr-gsm + gr-iridium
      # under QEMU for arm64 took over two hours.
      platforms: linux/amd64
      # Report, don't gate: a never-deployed developer tool whose fixable findings sit in Debian's
      # own packages (termshark's Go stdlib, python3-mako/-wheel/-jaraco from gnuradio's
      # dependencies), which only a Debian update can fix. Findings still go to code scanning.
      grype_fail_build: never
