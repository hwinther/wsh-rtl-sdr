name: Prune GHCR images

# Smart GHCR pruner via the reusable prune-ghcr.yml. Deletes:
#   - untagged manifests that aren't OCI 1.1 referrers (attestations are kept)
#   - tagged manifests whose only tags are GitVersion prerelease semvers
#     (X.Y.Z-<label>.<n>) for branches that no longer exist on origin
#   - cosign legacy sha256-XXXX.{sig,att,sbom} tags whose parent manifest is
#     itself being deleted in the same run
# Anything unrecognised is KEPT (fail-safe).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print what would be deleted without deleting"
        type: boolean
        default: false
      nuke_package:
        description: "DESTRUCTIVE. Package name (e.g. 'wsh-rtl-sdr/old-feeder') to delete entirely — leave blank for normal smart prune."
        type: string
        default: ""
  schedule:
    # Sunday 04:00 UTC — runs outside the working week, before Monday's
    # bump-sources.yml run.
    - cron: "0 4 * * 0"

permissions:
  contents: read
  packages: write
  pull-requests: read # the reusable job looks up open PRs for pr-<N> tags; without it the run never starts

jobs:
  prune:
    uses: hwinther/reusable-workflows/.github/workflows/prune-ghcr.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      # workflow_dispatch supplies inputs.dry_run; cron leaves it null and the
      # || false fallback makes scheduled runs actually prune.
      dry_run: ${{ inputs.dry_run || false }}
      # Filter discovery to GHCR packages under this repo: the images (ais-catcher, readsb,
      # fr24, opensky, piaware, tar1090, adsb-mqtt, dump1090-exporter, gsm-tools) and the
      # retired ones still holding versions (sdr-base, sdr-build, dump1090-fa, adsbexchange),
      # all under wsh-rtl-sdr/.
      package_namespace_prefix: wsh-rtl-sdr/
      # When set on a manual run, bypasses the smart prune and deletes the
      # entire named package via the GHCR package DELETE API. Cron runs leave
      # inputs.nuke_package null so this resolves to '' and the smart prune
      # runs as usual.
      nuke_package: ${{ inputs.nuke_package || '' }}
